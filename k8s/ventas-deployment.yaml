apiVersion: apps/v1
kind: Deployment
metadata:
  name: ventas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ventas
  template:
    metadata:
      labels:
        app: ventas
    spec:
      containers:
      - name: ventas
        image: localhost:5000/innovatech-backend-ventas:eks-v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: DB_ENDPOINT
          value: "mysql"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "despacho_db"
        - name: DB_USERNAME
          value: "root"
        - name: DB_PASSWORD
          value: "root"
