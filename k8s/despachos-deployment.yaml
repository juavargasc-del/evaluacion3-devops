apiVersion: apps/v1
kind: Deployment
metadata:
  name: despachos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: despachos
  template:
    metadata:
      labels:
        app: despachos
    spec:
      containers:
      - name: despachos
        image: localhost:5000/innovatech-backend-despachos:eks-v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
        env:
        - name: DB_ENDPOINT
          value: "mysql"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "despacho_db"
        - name: DB_USERNAME
          value: "root"
        - name: DB_PASSWORD
          value: "root"
